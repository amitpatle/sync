[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ghgl-sync"
version = "0.1.0"
description = "One-way, security-first GitHub -> GitLab synchronization engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "typer>=0.12,<1",
  "PyJWT[crypto]>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "respx>=0.21,<1",
  "ruff>=0.6",
  "mypy>=1.11,<2",
  "pre-commit>=3.8",
  "pip-audit>=2.7",
  "detect-secrets>=1.5,<2",
  "cyclonedx-bom>=4,<8",
]

[project.scripts]
ghgl-sync = "ghgl_sync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ghgl_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: requires a PostgreSQL test database (GHGL_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
